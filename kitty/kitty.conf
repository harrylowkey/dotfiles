# Use a Nerd Font so file-tree icons (nvim-tree, yazi, eza, etc.) render
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        13.0

# Explicit fallback for Nerd Font private-use glyphs (kitty >=0.32 does this
# automatically when Symbols Nerd Font Mono is installed, but be explicit)
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
